<!DOCTYPE html>

        .buttop{

            width:100%;

        .main>.buttab2{
            display: block;

        .main>.buttab2>div:nth-child(1){
            width:160px;

            background-color: transparent;
            position: relative;
            margin:15px;
        }
        .main>.buttab2>div:nth-child(1)>button{

            position: absolute;

        }
        .main>.buttab2>div:nth-child(1)>input{
            width:120px;
            height:30px;
            position: absolute;
            left:50%;top:50%;
            transform: translate(-50%,-50%);
            z-index:1;
            opacity: 0;
            overflow: hidden;
        }
        .main>.buttab2>div:nth-child(2){
            width:100%;
            height:400px;
            overflow-y: scroll;
        }
        .main>.buttab2>div:nth-child(2)>ul{
            width:100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }
        .main>.buttab2>div:nth-child(2)>ul>li,
        .main>.buttab2>div:nth-child(2)>ul>li>img{
            width:150px;
            height:200px;

        .main>.buttab3{
            display: none;
            justify-content: space-around;

            flex-direction: column;

        .main>.buttab3>div{
            width:100%;
            margin-bottom:15px;
            border:1px solid #000;
        }
        .main>.buttab3>div>h2{
            width:160px;
            height:50px;
            font-weight: bold;
            margin: 15px;
        }
        .main>.buttab3>div>ul{
            width:100%;
            display:flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px;
            box-sizing: border-box;
        }
        .main>.buttab3>div>ul>li{
            width:290px;
            height:150px;
            margin: 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-direction: column;
            border:1px solid #000;
        }
        .main>.buttab3>div>ul>li>div{
            width:100%;
            height:40px;
            margin: 5px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .main>.buttab3>div>ul>li>div>p{
            width:120px;
            height:100%;
            text-indent: 1em;
            line-height: 40px;
        }
        .main>.buttab3>div>ul>li>div>input,
        .main>.buttab3>div>ul>li>div>select{
            width:160px;
            height:100%;
            text-indent: 1em;
            line-height: 40px;
        }
    </style>
</head>
<body>

                    <li>

                    </li>
                    <li>

                    </li>
                    <li>
                        <div><p>归属：</p><input type="text"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token=decodeURIComponent(urlParams.get('token'))||"";
        if(!token)window.location.href="http://localhost:3000";
        const nonce = generateRandom6Digits(); // 隨機數
        const timestamp = Math.floor(Date.now() / 1000).toString(); // 秒級時間戳
        fetch("http://127.0.0.1:8787/api/public/findkey",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                'x-request-nonce': nonce,
                'x-request-timestamp': timestamp,
            }
        }).then(response=>{
            if(!response.ok){
                throw new Error(`HTTP 错误！状态码：${response.status}`)
            }
            return response.json();
        }).then(data=>{
            if(data.success)nextpost(data.data.public_keyF,data.data.private_keyE)
        }).catch(err=>{
            console.log(err);
        })
        async function nextpost(publicKeyF,privateKeyE){
            const custtoken=await decryptflare(privateKeyE,token);
            fetch("http://127.0.0.1:8787/api/protected/me",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":`Bearer ${custtoken}`
                }
            }).then(response=>{
                if(!response.ok){
                    throw new Error(`HTTP 错误！状态码：${response.status}`)
                }
                return response.json();
            }).then(data=>{console.log(data)
                if(!data.success)window.location.href="http://localhost:3000";
                nextsetup(custtoken);
            }).catch(err=>{
                console.log(err);
            })
            function nextsetup(custtoken){
                document.querySelector(".buttop>button:nth-child(1)").onclick=function(e){
                    e.stopPropagation();
                    document.querySelector(".main>.buttab2").style.display="block";
                    document.querySelector(".main>.buttab3").style.display="none";

                }
                document.querySelector(".buttop>button:nth-child(2)").onclick=function(e){
                    e.stopPropagation();
                    document.querySelector(".main>.buttab2").style.display="none";
                    document.querySelector(".main>.buttab3").style.display="flex";

                }
            }
        }
        
        function encryptflare(pem,str){
            return new Promise(async (resolve) => {    
                try {
                    if (!pem||!str) {
                        resolve(null);
                        return;
                    }
                        // 選擇對應的公鑰欄位（請對齊你的資料庫欄位名稱，此處以 public_keyE 為例）
                    const pkBuffer = pemToArrayBuffer(pem);

                    // 【關鍵修正】必須先 import 成 CryptoKey 物件
                    const publicKey = await crypto.subtle.importKey(
                    "spki",
                    pkBuffer,
                    { name: "RSA-OAEP", hash: "SHA-256" },
                    true,
                    ["encrypt"]
                    );

                    const encodedMessage = new TextEncoder().encode(str);
                    
                    const ciphertext = await crypto.subtle.encrypt(
                    { name: "RSA-OAEP" },
                    publicKey,
                    encodedMessage
                    );

                    // 將加密後的 ArrayBuffer 轉回 Base64 方便傳輸或檢視
                    const base64Cipher = btoa(String.fromCharCode(...new Uint8Array(ciphertext)));
                    resolve(base64Cipher);
                } catch (err) {
                    resolve(null);
                }
            });
        }
        function pemToArrayBuffer(pem) {
            const base64String = pem
                .replace(/-----BEGIN (.*)-----/, '')
                .replace(/-----END (.*)-----/, '')
                .replace(/\s+/g, '');
            
            const binaryString = atob(base64String);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }
        // 3. 解密
        function decryptflare(pem,ciphertextBase64){
            return new Promise(async (resolve) => {
                try {
                    if (!pem||!ciphertextBase64) {
                        resolve(null);
                        return;
                    }
                    
                    // A. 將 PEM 轉為 ArrayBuffer
                    const pkBuffer = pemToArrayBuffer(pem);
                    // B. 【關鍵修正】必須先 import 成 CryptoKey 物件
                    const privateKey = await crypto.subtle.importKey(
                        "pkcs8",
                        pkBuffer,
                        { name: "RSA-OAEP", hash: "SHA-256" },
                        true,
                        ["decrypt"]
                    );

                    // C. 將 Base64 密文轉為 ArrayBuffer
                    const cipherBuffer = base64ToArrayBuffer(ciphertextBase64);

                    // D. 執行解密
                    const decryptedBuffer = await crypto.subtle.decrypt(
                        { name: "RSA-OAEP" },
                        privateKey,
                        cipherBuffer
                    );

                    resolve(new TextDecoder().decode(decryptedBuffer));
                } catch (err) {
                    resolve(null);
                }
            });
        }
        // 2. Base64 密文轉 ArrayBuffer (解密時需要)
        function base64ToArrayBuffer(base64){
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }
        //随机数
        function generateRandom6Digits(){
            // 建立一個長度為 1 的 Uint32Array 來存放亂數
            const array = new Uint32Array(1);
            crypto.getRandomValues(array);
            
            // 將亂數對 1,000,000 取餘數，確保一定小於 1000000，然後補齊 6 位數（不足前面補 0）
            const randomNum = array[0] % 1000000;
            return String(randomNum).padStart(6, '0');
        }
    </script>
